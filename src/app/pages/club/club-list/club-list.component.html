<div class="button-container">
  <span class="create-button-row">
    <button mat-flat-button color="primary" (click)="navigateToCreateClub()">
      Create
    </button>
  </span>
  <span class="delete-button-row">
    <button mat-flat-button color="warn">Delete</button>
  </span>
</div>

<app-table [columns]="userColumns" [data]="userData" (selectedRows)="handleSelectedRows($event)"></app-table>
