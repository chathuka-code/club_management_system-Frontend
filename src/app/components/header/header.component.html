<mat-toolbar color="primary">
  <span>Club Management System</span>
  <span class="spacer"></span>
  
  <mat-form-field appearance="fill" *ngIf="roleOptions.length > 0">
    <mat-label>Current Role</mat-label>
    <mat-select 
      [value]="selectedRole?.value || ''"
      (valueChange)="onRoleChange($event)"
    >
      <mat-option *ngFor="let role of roleOptions" [value]="role.value">
        {{ role.display }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</mat-toolbar>
