<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Welcome Back</h1>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          email
          placeholder="Enter your email"
        />
        <mat-error *ngIf="loginForm.controls['email']?.errors?.['required']">
          Email is required
        </mat-error>
        <mat-error *ngIf="loginForm.controls['email']?.errors?.['email']">
          Please enter a valid email
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          minlength="8"
          placeholder="Enter your password"
        />
        <mat-error *ngIf="loginForm.controls['password']?.errors?.['required']">
          Password is required
        </mat-error>
        <mat-error
          *ngIf="loginForm.controls['password']?.errors?.['minlength']"
        >
          Password must be at least 8 characters
        </mat-error>
      </mat-form-field>

      <div class="error-message" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>

      <button
        mat-raised-button
        type="submit"
        class="login-button"
        [disabled]="!loginForm.valid || isLoading()"
      >
        <span *ngIf="!isLoading()">Login</span>
        <span *ngIf="isLoading()">Logging in...</span>
      </button>

      <div class="signup-link">
        Don't have an account? <a routerLink="/signup">Sign up</a>
      </div>
    </form>
  </div>
</div>
