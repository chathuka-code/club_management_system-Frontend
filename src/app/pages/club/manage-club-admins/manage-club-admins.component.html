<div class="button-container">
  <span class="create-button-row">
    <button
      *ngIf="currentRole === 'super-admin'"
      mat-flat-button
      color="primary"
      (click)="openUsersDialog()"
    >
      Add Club Admins
    </button>
  </span>
  <span class="delete-button-row">
    <button mat-flat-button color="warn" (click)="handleDelete()">
      Delete
    </button>
  </span>
</div>

<app-table
  [columns]="userColumns"
  [data]="userData()"
  [isEditEnabled]="false"
  (selectedRows)="handleSelectedRows($event)"
></app-table>
